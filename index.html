<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aulas Master Educação · MapleBear</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Twind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/twind@0.16.17/shim.min.js"></script>
    <style>
      :root {
        --orange-50:  #fff7ed;
        --orange-100: #ffedd5;
        --orange-200: #fed7aa;
        --orange-300: #fdba74;
        --orange-400: #fb923c;
        --orange-500: #f97316;
        --orange-600: #ea580c;
        --orange-700: #c2410c;
        --white:      #ffffff;
        --glass-bg:   rgba(255,255,255,0.65);
        --glass-border: rgba(249,115,22,0.18);
        --radius-xl: 2rem;
        --radius-lg: 1.25rem;
        --radius-md: 0.875rem;
        --shadow-soft: 0 8px 32px rgba(249,115,22,0.10);
        --shadow-card: 0 4px 24px rgba(249,115,22,0.13);
      }
      html, body {
        height: 100%;
      }
      body {
        min-height: 100vh;
        font-family: 'Nunito', sans-serif;
        color: #3a1a00;
        background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 40%, #fff3e0 70%, #fde8d0 100%);
        position: relative;
        overflow-x: hidden;
      }
      /* Decorative blobs */
      .blob-top {
        position: fixed;
        top: -120px; right: -120px;
        width: 520px; height: 520px;
        background: radial-gradient(circle, rgba(251,146,60,0.18) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
      }
      .blob-bottom {
        position: fixed;
        bottom: -100px; left: -100px;
        width: 440px; height: 440px;
        background: radial-gradient(circle, rgba(249,115,22,0.12) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
      }
      /* Glassmorphism header */
      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255,255,255,0.72);
        backdrop-filter: blur(18px) saturate(1.4);
        border-bottom: 1.5px solid rgba(249,115,22,0.15);
        box-shadow: 0 2px 18px rgba(249,115,22,0.08);
        padding: 0.7rem 2rem;
        display: flex;
        align-items: center;
        gap: 1.2rem;
        justify-content: flex-start;
      }
      .logo-icon {
        width: 42px; height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #fb923c, #ea580c);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 12px rgba(234,88,12,0.25);
        font-size: 1.5rem;
      }
      .logo-text {
        font-family: 'Baloo 2', cursive;
        font-weight: 800;
        font-size: 1.2rem;
        color: #ea580c;
        line-height: 1;
      }
      .logo-sub {
        font-family: 'Nunito', sans-serif;
        font-weight: 600;
        font-size: 0.72rem;
        color: #fb923c;
        letter-spacing: 0.04em;
        margin-top: 0.1em;
      }
      .header-titles {
        display: flex;
        flex-direction: column;
        gap: 0.1em;
      }
      /* Remover sublinhado dos links */
      a {
        text-decoration: none;
      }
      /* Grid of folders */
      .folders-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 2.2rem;
        max-width: 860px;
        margin: 3.5rem auto 0 auto;
        padding: 0 1.5rem;
        position: relative;
        z-index: 1;
      }
      @media (max-width: 900px) {
        .folders-grid { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 600px) {
        .folders-grid { grid-template-columns: 1fr; gap: 1.2rem; }
        .header { padding: 0.6rem 1rem; }
        .logo-text { font-size: 1rem; }
      }
      @media (max-width: 600px) {
        .header img[alt="Logo 2"] {
          right: 1rem !important;
          width: 32px !important;
          height: 32px !important;
        }
      }
      .folder-card {
        background: var(--glass-bg);
        border: 1.5px solid var(--glass-border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(20px) saturate(1.3);
        padding: 2.2rem 1.5rem 1.5rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: box-shadow 0.25s, transform 0.25s;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        min-height: 180px;
        animation: fadeInUp 0.7s cubic-bezier(0.4,0,0.2,1);
      }
      .folder-card:hover {
        box-shadow: 0 12px 40px rgba(249,115,22,0.14);
        transform: translateY(-2px) scale(1.03);
      }
      .folder-icon {
        width: 52px; height: 52px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #fb923c, #ea580c);
        box-shadow: 0 4px 16px rgba(234,88,12,0.22);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1.1rem;
        font-size: 2.1rem;
        color: #fff;
      }
      .folder-title {
        font-family: 'Baloo 2', cursive;
        font-weight: 800;
        font-size: 1.15rem;
        color: #c2410c;
        letter-spacing: 0.01em;
        text-align: center;
      }
      /* Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="blob-top"></div>
    <div class="blob-bottom"></div>
    <header class="header" style="position:relative;">
      <a href="index.html" style="display:flex;gap:4px;padding:0;background:none;box-shadow:none;border-radius:0;align-items:center;cursor:pointer;text-decoration:none;">
        <img src="logo1.png" alt="Logo 1" style="width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(249,115,22,0.10);">
      </a>
      <div class="header-titles" style="margin-left:10px;">
        <div class="logo-text">Aulas Master Educação</div>
        <div class="logo-sub">MapleBear</div>
      </div>
      <img src="logo2.png" alt="Logo 2" style="position:absolute;right:2rem;top:50%;transform:translateY(-50%);width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(249,115,22,0.10);">
    </header>
    <main>
      <section class="folders-grid">
        <a href="portugues.html" class="folder-card" title="Ir para Português">
          <span class="folder-icon">
            <span class="material-icons" style="font-size:2.1rem;">folder</span>
          </span>
          <span class="folder-title">Português</span>
        </a>
        <a href="historia.html" class="folder-card" title="Ir para História">
          <span class="folder-icon">
            <span class="material-icons" style="font-size:2.1rem;">folder</span>
          </span>
          <span class="folder-title">História</span>
        </a>
        <!-- Espaço para E.L.A -->
        <a href="ela.html" class="folder-card" title="Ir para E.L.A">
          <span class="folder-icon">
            <span class="material-icons" style="font-size:2.1rem;">folder</span>
          </span>
          <span class="folder-title">E.L.A</span>
        </a>
        <!-- Espaço para E.L.A -->
        <a href="geografia.html" class="folder-card" title="Ir para Geografia">
          <span class="folder-icon">
            <span class="material-icons" style="font-size:2.1rem;">Geografia</span>
          </span>
          <span class="folder-title">Geografia</span>
        </a>
        <!-- Próximas seções -->
        <div class="folder-card" style="opacity:0.45;pointer-events:none;">
          <span class="folder-icon">
            <span class="material-icons" style="font-size:2.1rem;">folder</span>
          </span>
          <span class="folder-title">Em breve</span>
        </div>
      </section>
    </main>
  </body>
</html>
