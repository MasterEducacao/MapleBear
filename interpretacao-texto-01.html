<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interpretação de Texto 01 · MapleBear</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange-50: #fff7ed;
    --orange-100: #ffedd5;
    --orange-200: #fed7aa;
    --orange-300: #fdba74;
    --orange-400: #fb923c;
    --orange-500: #f97316;
    --orange-600: #ea580c;
    --orange-700: #c2410c;
    --white: #ffffff;
    --glass-bg: rgba(255,255,255,0.65);
    --glass-border: rgba(249,115,22,0.18);
    --shadow-soft: 0 8px 32px rgba(249,115,22,0.10);
    --shadow-card: 0 4px 24px rgba(249,115,22,0.13);
    --radius-xl: 2rem;
    --radius-lg: 1.25rem;
    --radius-md: 0.875rem;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 40%, #fff3e0 70%, #fde8d0 100%);
    min-height: 100vh;
    color: #3a1a00;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -120px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(251,146,60,0.18) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -100px;
    width: 440px; height: 440px;
    background: radial-gradient(circle, rgba(249,115,22,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(18px) saturate(1.4);
    background: rgba(255,255,255,0.72);
    border-bottom: 1.5px solid rgba(249,115,22,0.15);
    box-shadow: 0 2px 18px rgba(249,115,22,0.08);
    padding: 0.7rem 2rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .logo { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; }
  .logo-text { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.2rem; color: var(--orange-600); line-height: 1; }
  .logo-sub { font-size: 0.72rem; font-weight: 600; color: var(--orange-400); letter-spacing: 0.04em; }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-bar-wrap { width: 200px; }
  .progress-label { font-size: 0.7rem; font-weight: 700; color: var(--orange-500); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .progress-track { height: 8px; background: rgba(253,186,116,0.35); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange-400), var(--orange-600)); border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1); width: 0%; }

  .score-badge {
    background: linear-gradient(135deg, var(--orange-400), var(--orange-600));
    color: #fff; font-weight: 800; font-size: 0.95rem;
    padding: 0.38rem 0.9rem; border-radius: 99px;
    box-shadow: 0 3px 12px rgba(234,88,12,0.28);
    white-space: nowrap;
  }

  /* HERO */
  .hero {
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    position: relative; z-index: 1;
  }
  .hero-badge {
    display: inline-block;
    background: linear-gradient(90deg, #fb923c22, #f9731611);
    border: 1.5px solid var(--orange-300);
    border-radius: 99px;
    padding: 0.3rem 1rem;
    font-size: 0.78rem; font-weight: 700;
    color: var(--orange-600);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .hero h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    color: var(--orange-700);
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }
  .hero p { font-size: 1rem; color: #a05022; max-width: 560px; margin: 0 auto; font-weight: 500; }

  /* QUIZ AREA */
  #quiz-wrap {
    max-width: 680px;
    margin: 0 auto 4rem auto;
    padding: 0 1rem;
    position: relative; z-index: 1;
  }

  /* SECTION INTRO */
  .section-intro {
    background: linear-gradient(135deg, rgba(255,237,213,0.9), rgba(254,215,170,0.6));
    border: 1.5px solid rgba(253,186,116,0.5);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.4rem;
    margin-bottom: 1.2rem;
    animation: fadeInUp 0.4s cubic-bezier(.4,0,.2,1);
  }
  .section-intro-title { font-family: 'Baloo 2', cursive; font-weight: 800; color: var(--orange-700); font-size: 1.15rem; margin-bottom: 0.3rem; }
  .section-intro-instructions { font-size: 0.92rem; color: #7c3500; font-weight: 600; font-style: italic; }

  /* LEVEL BADGE */
  .level-badge {
    font-size: 11px; font-weight: 700;
    padding: 3px 12px; border-radius: 99px;
    display: inline-block;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sec-badge-1 { background: #E6F1FB; color: #0C447C; }
  .sec-badge-2 { background: #FAEEDA; color: #633806; }
  .sec-badge-3 { background: #FBEAF0; color: #72243E; }

  /* QUESTION CARD */
  .q-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(1.3);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-soft);
    padding: 2rem 2.2rem 1.8rem;
    margin-bottom: 1rem;
    position: relative; overflow: hidden;
    animation: fadeInUp 0.4s cubic-bezier(.4,0,.2,1);
  }
  .q-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--orange-400), var(--orange-600), var(--orange-300));
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  }

  .q-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
    flex-wrap: wrap; gap: 0.5rem;
  }
  .q-num { font-size: 13px; color: #a05022; font-weight: 600; }

  .question-text {
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem; font-weight: 700;
    color: var(--orange-700);
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    background: rgba(255,255,255,0.8);
    border: 1.5px solid var(--orange-200);
    border-radius: var(--radius-md);
    padding: 0.85rem 1.1rem;
    text-align: left; cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 600;
    color: #3a1a00;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    display: flex; align-items: center; gap: 10px;
  }
  .opt-btn:hover:not(:disabled) {
    background: var(--orange-50);
    border-color: var(--orange-400);
    transform: translateX(3px);
  }
  .opt-btn.correct {
    background: #EAF3DE; border-color: #639922; color: #27500A;
  }
  .opt-btn.wrong {
    background: #FCEBEB; border-color: #E24B4A; color: #501313;
  }
  .opt-label {
    font-weight: 800;
    min-width: 26px;
    width: 26px; height: 26px;
    background: var(--orange-100);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--orange-700);
    flex-shrink: 0;
  }
  .opt-btn.correct .opt-label { background: #c6e89a; color: #27500A; }
  .opt-btn.wrong .opt-label { background: #f5b8b8; color: #501313; }

  /* FLASHCARD */
  .show-answer-btn {
    width: 100%;
    padding: 0.85rem;
    background: rgba(255,255,255,0.85);
    border: 1.5px dashed var(--orange-400);
    border-radius: var(--radius-md);
    font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 800;
    cursor: pointer; color: var(--orange-600);
    transition: background 0.15s, transform 0.1s;
  }
  .show-answer-btn:hover { background: var(--orange-50); transform: translateY(-1px); }

  .reveal-box {
    display: none;
    background: linear-gradient(90deg, rgba(253,186,116,0.35), rgba(249,115,22,0.10));
    border-left: 4px solid var(--orange-500);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    padding: 0.9rem 1.1rem;
    margin-top: 1rem;
    font-weight: 600; font-size: 0.98rem; color: var(--orange-700);
    line-height: 1.5;
  }
  .reveal-box.show { display: block; animation: fadeInUp 0.3s ease; }

  .self-assess {
    display: none;
    gap: 10px;
    margin-top: 1rem;
  }
  .self-assess.show { display: flex; }
  .self-assess button {
    flex: 1;
    padding: 0.8rem;
    border-radius: var(--radius-md);
    border: 1.5px solid transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 800;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .self-assess button:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-got-it { background: #EAF3DE; color: #27500A; border-color: #639922; }
  .btn-review { background: #FCEBEB; color: #501313; border-color: #E24B4A; }

  /* FEEDBACK */
  .feedback {
    margin-top: 1rem;
    padding: 0.85rem 1.1rem;
    border-radius: var(--radius-md);
    font-size: 14px; font-weight: 700;
    display: none;
    border-left: 4px solid transparent;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #EAF3DE; color: #27500A; border-left-color: #639922; }
  .feedback.wrong { background: #FCEBEB; color: #501313; border-left-color: #E24B4A; }

  /* NEXT BUTTON */
  .next-btn {
    margin-top: 1rem; width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, var(--orange-400), var(--orange-600));
    border: none;
    border-radius: var(--radius-md);
    font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 800;
    cursor: pointer; color: #fff;
    box-shadow: 0 4px 16px rgba(234,88,12,0.25);
    display: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { opacity: 0.92; transform: translateY(-1px); }

  /* RESULTS */
  .results {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(1.3);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-soft);
    padding: 2.5rem 2.2rem;
    text-align: center;
    position: relative; overflow: hidden;
    animation: fadeInUp 0.5s cubic-bezier(.4,0,.2,1);
  }
  .results::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--orange-400), var(--orange-600), var(--orange-300));
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  }
  .results h2 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem; font-weight: 800;
    margin-bottom: 0.4rem; color: var(--orange-700);
  }
  .final-score {
    font-family: 'Baloo 2', cursive;
    font-size: 3.5rem; font-weight: 800;
    color: var(--orange-600);
    margin: 1rem 0;
    line-height: 1;
  }
  .final-pct { font-size: 14px; color: #a05022; font-weight: 600; margin-bottom: 1.5rem; }

  .wrong-list { text-align: left; margin: 1.5rem 0; }
  .wrong-list-title { font-size: 14px; font-weight: 700; margin-bottom: 0.75rem; color: #a05022; }
  .wrong-item {
    background: rgba(255,255,255,0.7);
    border-radius: var(--radius-md);
    padding: 0.85rem 1.1rem;
    margin-bottom: 0.5rem;
    font-size: 14px; color: #3a1a00;
    border-left: 4px solid #E24B4A;
  }
  .wrong-item .correct-ans { color: #3B6D11; font-weight: 700; }

  .restart-btn {
    padding: 0.85rem 2.2rem;
    background: linear-gradient(135deg, var(--orange-400), var(--orange-600));
    border: none; border-radius: var(--radius-md);
    font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 800;
    cursor: pointer; color: #fff;
    box-shadow: 0 4px 16px rgba(234,88,12,0.25);
    margin-top: 1rem;
    transition: opacity 0.15s, transform 0.1s;
  }
  .restart-btn:hover { opacity: 0.92; transform: translateY(-1px); }
  .back-home {
    display: inline-block; margin-top: 0.75rem;
    font-size: 14px; font-weight: 700;
    color: var(--orange-600); text-decoration: none;
    padding: 0.5rem 1.2rem;
    border: 1.5px solid var(--orange-300);
    border-radius: 99px;
    transition: background 0.15s;
  }
  .back-home:hover { background: var(--orange-50); }

  /* ANIMATIONS */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    header { padding: 0.6rem 1rem; }
    .progress-bar-wrap { display: none; }
    .hero { padding: 2rem 1rem 1.5rem; }
    .q-card { padding: 1.5rem 1.2rem; }
    .question-text { font-size: 1.05rem; }
    .self-assess { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo" style="text-decoration:none;">
    <img src="logo1.png" alt="Logo" style="width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(249,115,22,0.10);">
    <div>
      <div class="logo-text">Aulas Master Educação</div>
      <div class="logo-sub">MapleBear</div>
    </div>
  </a>

  <div class="header-right">
    <div class="progress-bar-wrap">
      <div class="progress-label">Progresso</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress"></div>
      </div>
    </div>
    <div class="score-badge">⭐ <span id="score-display">0</span> / 500</div>
    <img src="logo2.png" alt="Logo 2" style="width:38px;height:38px;object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(249,115,22,0.10);">
  </div>
</header>

<section class="hero">
  <div class="hero-badge">Reading Comprehension · 4th Grade</div>
  <h1>Interpretação de Texto 01</h1>
  <p>A Festa no Céu · The Party in the Sky — leia a história do Sapo e do Urubu, responda às perguntas de interpretação e revise vocabulário e expressões em inglês.</p>
</section>

<div id="quiz-wrap"></div>

<script>
const SECTIONS = [
  {
    title: "Interpretação de Texto — A Festa no Céu",
    instructions: "Leia a história com atenção e escolha a alternativa correta.",
    type: "mc",
    badge: "sec-badge-1",
    questions: [
      { question: "No início da história (Quadro 1), qual ave sai voando pela floresta para anunciar que haverá uma festa no céu?", options: { A: "O Tucano", B: "A Arara", C: "O Urubu", D: "O Passarinho Verde" }, answer: "B" },
      { question: "Como o Esquilo se sente no Quadro 1 quando descobre sobre a festa no céu?", options: { A: "Feliz porque vai poder voar até lá.", B: "Triste (com pena) porque os animais que não voam não vão poder ir.", C: "Bravo com o Macaco.", D: "Animado para tocar viola." }, answer: "B" },
      { question: "O que o Macaco quis dizer com a frase: 'Bichos sem asa não têm vez nessa festa...'?", options: { A: "Que todos os bichos deveriam comprar asas.", B: "Que apenas os animais que sabem voar conseguiriam participar da festa.", C: "Que a festa seria feita no chão da floresta.", D: "Que ele não gostava de festas." }, answer: "B" },
      { question: "No Quadro 2, enquanto está na floresta durante o dia, qual é a decisão que o Sapo toma?", options: { A: "Desistir de ir à festa.", B: "Aprender a voar com a Arara.", C: "Dar um jeito de ir à festa de qualquer maneira.", D: "Dormir junto com o Urubu." }, answer: "C" },
      { question: "Quem dá uma risada e diz que o Sapo é o bicho mais engraçado da floresta no Quadro 2?", options: { A: "O Sapinho", B: "O Urubu", C: "O Jacaré", D: "O Macaco" }, answer: "A" },
      { question: "Em qual cenário e momento do dia o Sapo diz 'Psiu... é agora ou nunca!' (Quadro 3)?", options: { A: "Na floresta, durante o dia brilhante.", B: "No meio da festa no céu, cercado de nuvens.", C: "Em um quarto à noite, com a janela aberta e a lua visível.", D: "Na beira do lago, ao amanhecer." }, answer: "C" },
      { question: "Onde exatamente o Sapo entra para se esconder no Quadro 4?", options: { A: "Debaixo da cama do Urubu.", B: "Dentro da caixa acústica da viola (ou violão).", C: "Atrás de uma grande nuvem estrelada.", D: "Dentro de uma cesta de frutas." }, answer: "B" },
      { question: "O que o Urubu faz enquanto voa em direção ao céu carregando seu instrumento no Quadro 5?", options: { A: "Ele voa em silêncio absoluto para não acordar o Sapo.", B: "Ele reclama que a viagem está muito longa.", C: "Ele canta 'Rru-rru-rruuuu! Vamos para o céu!'.", D: "Ele conversa com o Passarinho Amarelo." }, answer: "C" },
      { question: "Assim que chega ao céu estrelado (Quadro 6), o que o Urubu diz que vai fazer antes de começar a festa?", options: { A: "Dizer olá (saudar) para os outros passarinhos.", B: "Procurar algo gostoso para comer na mesa.", C: "Colocar a viola no chão e abrir para ver o que tem dentro.", D: "Dançar imediatamente com a Arara Azul." }, answer: "A" },
      { question: "Qual é a reação da Arara Azul ao ver o Sapo sair da viola gritando 'Surpresa! Cheguei!' (Quadro 7)?", options: { A: "Ela fica brava e pede para ele ir embora.", B: "Ela fica surpresa e diz: 'UAU! Um sapo?! Aqui no céu?!'.", C: "Ela não liga e continua comendo biscoitos.", D: "Ela começa a chorar de medo." }, answer: "B" },
      { question: "Durante a festa no céu (Quadro 8), o que o Sapo faz junto com os pássaros?", options: { A: "Fica escondido com medo de ser jogado lá de cima.", B: "Dança muito feliz e diz que aquela é a melhor festa da vida dele.", C: "Ajuda a servir a comida para os convidados.", D: "Começa a tocar a viola do Urubu." }, answer: "B" },
      { question: "No Quadro 9, o Passarinho Verde faz um comentário sobre o Sapo. O que ele diz?", options: { A: "Que o sapo é muito comilão.", B: "Que o sapo está muito cansado e quer dormir.", C: "Que o sapo é muito animado.", D: "Que o sapo não sabe dançar direito." }, answer: "C" },
      { question: "Quais comidas gostosas aparecem no cenário da mesa da festa no céu (Quadro 10)?", options: { A: "Frutas e biscoitos em formato de estrela.", B: "Bolo de chocolate e brigadeiros.", C: "Insetos saborosos e moscas.", D: "Sanduíches e suco de laranja." }, answer: "A" },
      { question: "Por que o Sapo teve dificuldades e disse 'Uff... acho que comi demais!' ao tentar entrar na viola para voltar (Quadro 12)?", options: { A: "Porque a viola diminuiu de tamanho.", B: "Porque ele ficou muito pesado e apertado dentro dela depois de comer bastante.", C: "Porque o Urubu trancou a viola com um cadeado.", D: "Porque ele estava com sono e não conseguia se mexer." }, answer: "B" },
      { question: "Durante o voo de volta (Quadro 14), o que faz o Urubu desconfiar de que há algo errado com seu instrumento?", options: { A: "Ele ouve o Sapo cantando alto.", B: "Ele sente a viola muito leve.", C: "Ele estranha um movimento e um tremor vindo de dentro da viola.", D: "A Arara conta toda a verdade para ele." }, answer: "C" },
      { question: "Qual frase o Urubu diz no Quadro 16 ao descobrir o Sapo escondido em sua viola?", options: { A: "'Ahá! Sabia! Eu senti um peso extra! Seu sapo esperto... andou escondido!'", B: "'Que bom que você veio comigo, Sapo, a viagem foi ótima!'", C: "'Por favor, não pule da minha viola!'", D: "'Gostou dos biscoitos de estrela?'" }, answer: "A" },
      { question: "No Quadro 18, como o Sapo tenta se desculpar com o Urubu que está irritado?", options: { A: "Ele diz que entrou na viola sem querer.", B: "Ele diz que não resistiu porque a festa parecia muito linda.", C: "Ele diz que o Macaco mandou ele ir.", D: "Ele finge que está dormindo e não responde." }, answer: "B" },
      { question: "O que acontece com o Sapo no Quadro 19 quando o cenário mostra o céu ao amanhecer?", options: { A: "Ele ganha asas e sai voando sozinho.", B: "O Urubu perdoa o Sapo e o carrega com carinho.", C: "Ele é lançado (expulso) para fora da viola pelo Urubu.", D: "Ele cai no sono dentro da viola." }, answer: "C" },
      { question: "O Sapo cai do céu em direção à floresta fazendo qual som de mergulho ao atingir a água do lago (Quadro 22)?", options: { A: "TCHIBUM!", B: "PLOFT!", C: "CRASH!", D: "POW!" }, answer: "B" },
      { question: "Na margem do lago, ao nascer do sol (Quadro 24), qual animal demonstra grande curiosidade e diz: 'Conta tudo, Sapo!'?", options: { A: "O Jacaré", B: "A Raposa", C: "O Macaco", D: "O Urubu" }, answer: "A" }
    ]
  },
  {
    title: "Vocabulário e Expressões",
    instructions: "Pense na resposta. Depois clique em \"Mostrar Resposta\" para conferir e se autoavaliar.",
    type: "flashcard",
    badge: "sec-badge-2",
    questions: [
      { question: "No quadro 1, o Squirrel usa a expressão 'What a shame'. O que essa expressão significa em português?", expected: "Significa 'Que pena' ou 'Que lástima'." },
      { question: "A palavra 'wingless', usada pelo Monkey no quadro 1, é formada por 'wing' + 'less'. O que ela quer dizer?", expected: "Significa 'sem asas' (animais que não têm asas)." },
      { question: "Ainda no quadro 1, o que significa a expressão idiomática 'don't stand a chance' na fala do Monkey?", expected: "Significa 'não têm a menor chance' ou 'não têm oportunidade'." },
      { question: "Na fala do Toad (quadro 2), ele garante: 'I'll find a way'. Qual é a melhor tradução para 'find a way' nesse contexto?", expected: "Significa 'dar um jeito', 'encontrar uma maneira' ou 'encontrar uma solução'." },
      { question: "O Vulture se despede dizendo 'I'm heading to sleep now' (quadro 2). O que a estrutura 'heading to' expressa?", expected: "Expressa a ideia de 'indo para' ou 'me dirigindo para' (ir dormir)." },
      { question: "O Toad pula a janela no quadro 3 dizendo 'it's now or never!'. O que essa expressão significa?", expected: "Significa 'é agora ou nunca'." },
      { question: "No cenário do quadro 4, o Toad se esconde na 'soundbox' do 'guitar'. O que significam esses dois termos em português?", expected: "Significam 'caixa de ressonância' (ou interior do instrumento) e 'violão'." },
      { question: "Ao chegar à festa (quadro 6), o Vulture diz: 'I'm going to greet the other little birds!'. O que significa o verbo 'greet'?", expected: "Significa 'cumprimentar' ou 'saudar'." },
      { question: "Como podemos interpretar a pergunta do Yellow Bird: 'How did you manage to get up here?!' (quadro 7)?", expected: "Pode ser traduzida como 'Como você conseguiu subir/chegar até aqui?!'." },
      { question: "O Green Bird elogia o Toad dizendo 'This toad is so lively' (quadro 9). O que o adjetivo 'lively' descreve?", expected: "Descreve alguém 'animado', 'cheio de vida', 'energético' ou 'vibrante'." },
      { question: "No quadro 10, o Vulture percebe que 'dawn is breaking'. A qual fenômeno ou período do dia ele está se referindo?", expected: "Ele se refere ao amanhecer / ao raiar do dia." },
      { question: "Na fala 'The Vulture is leaving' (quadro 11), qual é a tradução da ação que o verbo 'leaving' indica?", expected: "Indica que o Vulture está 'saindo', 'indo embora' ou 'partindo'." },
      { question: "A descrição da ação no quadro 12 diz que o Toad 'Gets stuck'. O que acontece com alguém que 'gets stuck'?", expected: "A pessoa ou animal 'fica preso' ou 'entalado'." },
      { question: "A palavra 'Oof', dita pelo Toad (quadro 12), é uma interjeição ou onomatopeia. O que ela expressa geralmente?", expected: "Expressa esforço físico, desconforto, surpresa ou a sensação de estar estufado/pesado." },
      { question: "No quadro 13, o Vulture diz: 'Let's head back to the forest!'. O que significa o phrasal verb 'head back'?", expected: "Significa 'voltar' ou 'retornar'." },
      { question: "A palavra 'shaking', mencionada pelo Vulture ao sentir o violão estranho (quadro 14), refere-se a que tipo de movimento?", expected: "Refere-se a 'tremer', 'sacudir' ou 'chacoalhar'." },
      { question: "Na ação descrita no quadro 15, o Toad acaba 'popping out of the guitar'. O que significa 'popping out'?", expected: "Significa 'saindo para fora' (de forma abrupta, saltando ou pulando para fora)." },
      { question: "O Vulture se refere ao Toad como 'You clever toad' (quadro 16 e 17). O que significa o adjetivo 'clever'?", expected: "Significa 'esperto', 'inteligente' ou 'astuto'." },
      { question: "A palavra 'prank', mencionada nos quadros 16 e 18, refere-se a qual atitude do sapo?", expected: "Refere-se à 'pegadinha', 'travessura' ou 'brincadeira' que ele fez para ir à festa." },
      { question: "Na narração do último quadro, a palavra 'resourcefulness' é mencionada como uma virtude. O que ela significa?", expected: "Significa 'engenhosidade', 'desenvoltura' ou 'capacidade de encontrar soluções práticas'." }
    ]
  },
  {
    title: "Interpretação de Texto — The Party in the Sky",
    instructions: "Pense na resposta. Depois clique em \"Mostrar Resposta\" para conferir e se autoavaliar.",
    type: "flashcard",
    badge: "sec-badge-3",
    questions: [
      { question: "De acordo com os eventos do quadro 1, qual é o grande evento sendo anunciado na floresta pelo pássaro Macaw?", expected: "O evento é uma festa no céu (Party in the sky)." },
      { question: "Por que o Squirrel (esquilo) e o Monkey (macaco) concluem pelas suas falas que não poderão comparecer à festa?", expected: "Porque a festa é no céu e eles constatam que, sendo animais sem asas (que não voam), não têm chances de chegar lá." },
      { question: "Analisando os cenários dos quadros 2, 3 e 4, qual é o plano exato que o Toad elabora e executa durante a noite para chegar à festa?", expected: "Ele aproveita que o Vulture foi dormir, pula pela janela do quarto à noite e se esconde dentro da caixa de ressonância do violão do pássaro." },
      { question: "Quando o Toad aparece no quadro 7 pulando para fora do violão e gritando 'Surprise!', qual é a reação dos outros pássaros (Blue Macaw e Yellow Bird)?", expected: "Eles ficam extremamente surpresos e chocados, questionando como um sapo, que não voa, conseguiu chegar até a festa no céu." },
      { question: "Baseado nos quadros 8 e 9, como é a interação do Toad com os pássaros durante a festa?", expected: "Ele dança alegremente, encanta os pássaros (que o acham cheio de vida/animado) e diz que é a melhor festa da vida dele." },
      { question: "No quadro 12, ao tentar se esconder no violão para o voo de volta, o Toad enfrenta uma dificuldade gerada por uma ação dele no quadro 10. Qual foi o problema?", expected: "Ele comeu muito na festa e quase ficou preso (entalado) ao tentar entrar de volta na abertura do violão." },
      { question: "Analisando os quadros 14 a 16 (cenário de céu durante o voo), como o Vulture descobre que carregava um 'passageiro clandestino'?", expected: "O Vulture sente um peso extra e nota o violão tremendo (shaking), pois o Toad começou a se mexer muito lá dentro, acabando por pular para fora." },
      { question: "Nos quadros 18 e 19, o Vulture diz que o sapo 'merece um banho de água fria'. Qual é a ação imediata do Vulture como punição pela travessura?", expected: "Ele sacode/chuta o Toad para fora do violão, jogando-o das alturas em direção à floresta." },
      { question: "Observe o cenário e efeitos sonoros do quadro 22. Como o Toad escapa de um desfecho fatal na sua queda do céu?", expected: "Ele consegue sobreviver porque cai direto nas águas de um lago na floresta (indicado pelo barulho 'SPLASH!')." },
      { question: "Lendo a narração do quadro final (quadro 24), qual é a lição de moral que a história transmite usando a aventura do sapo como exemplo?", expected: "A lição de que, com criatividade e desenvoltura, até mesmo quem parece não ter chances de ir longe pode encontrar um meio (dar um jeito) de alcançar seus objetivos." }
    ]
  }
];

const FLAT = [];
SECTIONS.forEach((sec, sIdx) => {
  sec.questions.forEach((q, qIdx) => {
    FLAT.push({
      sectionIdx: sIdx,
      sectionTitle: sec.title,
      instructions: sec.instructions,
      badge: sec.badge,
      type: sec.type,
      isFirstOfSection: qIdx === 0,
      question: q.question,
      options: q.options,
      answer: q.answer,
      expected: q.expected
    });
  });
});

const POINTS_PER_Q = 10;
let current = 0, score = 0, answered = false, wrongAnswers = [];

function render() {
  if (current >= FLAT.length) { showResults(); return; }
  const item = FLAT[current];
  answered = false;
  document.getElementById('progress').style.width = (current / FLAT.length * 100) + '%';
  document.getElementById('score-display').textContent = score;

  const introHtml = item.isFirstOfSection ? `
      <div class="section-intro">
        <div class="section-intro-title">${item.sectionTitle}</div>
        <div class="section-intro-instructions">${item.instructions}</div>
      </div>` : '';

  if (item.type === 'mc') {
    const letters = Object.keys(item.options);
    document.getElementById('quiz-wrap').innerHTML = `
      ${introHtml}
      <div class="q-card">
        <div class="q-header">
          <span class="level-badge ${item.badge}">${item.sectionTitle}</span>
          <span class="q-num">Question ${current + 1} of ${FLAT.length}</span>
        </div>
        <div class="question-text">${item.question}</div>
        <div class="options" id="options">
          ${letters.map(letter => `
            <button class="opt-btn" onclick="answerMC('${letter}')" id="opt-${letter}">
              <span class="opt-label">${letter}</span>
              ${item.options[letter]}
            </button>
          `).join('')}
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQ()">
          ${current === FLAT.length - 1 ? 'Ver Resultado →' : 'Próxima Pergunta →'}
        </button>
      </div>`;
  } else {
    document.getElementById('quiz-wrap').innerHTML = `
      ${introHtml}
      <div class="q-card">
        <div class="q-header">
          <span class="level-badge ${item.badge}">${item.sectionTitle}</span>
          <span class="q-num">Question ${current + 1} of ${FLAT.length}</span>
        </div>
        <div class="question-text">${item.question}</div>
        <button class="show-answer-btn" id="show-answer-btn" onclick="showAnswer()">👀 Mostrar Resposta</button>
        <div class="reveal-box" id="reveal-box"></div>
        <div class="self-assess" id="self-assess">
          <button class="btn-got-it" onclick="selfAssess(true)">✓ Acertei</button>
          <button class="btn-review" onclick="selfAssess(false)">✗ Preciso revisar</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQ()">
          ${current === FLAT.length - 1 ? 'Ver Resultado →' : 'Próxima Pergunta →'}
        </button>
      </div>`;
  }
}

function answerMC(letter) {
  if (answered) return;
  answered = true;
  const item = FLAT[current];
  const correct = letter === item.answer;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    const l = b.id.replace('opt-', '');
    if (l === item.answer) b.classList.add('correct');
    else if (l === letter && !correct) b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if (correct) {
    score += POINTS_PER_Q;
    document.getElementById('score-display').textContent = score;
    fb.classList.add('correct');
    fb.textContent = `✓ Correto! +${POINTS_PER_Q} pontos`;
  } else {
    fb.classList.add('wrong');
    fb.textContent = `✗ Incorrect. Correct answer: ${item.answer}) ${item.options[item.answer]}`;
    wrongAnswers.push({ q: item.question, correct: `${item.answer}) ${item.options[item.answer]}`, chosen: `${letter}) ${item.options[letter]}` });
  }
  document.getElementById('next-btn').classList.add('show');
}

function showAnswer() {
  const item = FLAT[current];
  document.getElementById('show-answer-btn').style.display = 'none';
  const box = document.getElementById('reveal-box');
  box.textContent = 'Resposta esperada: ' + item.expected;
  box.classList.add('show');
  document.getElementById('self-assess').classList.add('show');
}

function selfAssess(correct) {
  if (answered) return;
  answered = true;
  const item = FLAT[current];
  document.getElementById('self-assess').style.display = 'none';
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if (correct) {
    score += POINTS_PER_Q;
    document.getElementById('score-display').textContent = score;
    fb.classList.add('correct');
    fb.textContent = `✓ Ótimo! +${POINTS_PER_Q} pontos`;
  } else {
    fb.classList.add('wrong');
    fb.textContent = '✗ Sem problemas — essa entrou na lista de revisão!';
    wrongAnswers.push({ q: item.question, correct: item.expected, chosen: '(marcado para revisão)' });
  }
  document.getElementById('next-btn').classList.add('show');
}

function nextQ() { current++; render(); }

function showResults() {
  document.getElementById('progress').style.width = '100%';
  const maxScore = FLAT.length * POINTS_PER_Q;
  const pct = Math.round(score / maxScore * 100);
  const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : '💪';
  const msg = pct >= 80 ? 'Excellent work!' : pct >= 60 ? 'Good job!' : 'Keep practicing!';
  const wrongHtml = wrongAnswers.length === 0
    ? `<p style="color:#a05022;font-size:14px;text-align:center;">Perfect score — no wrong answers! 🎉</p>`
    : wrongAnswers.map(w => `
        <div class="wrong-item">
          <div style="margin-bottom:4px;font-weight:600;">${w.q}</div>
          <div>Your answer: <span style="color:#E24B4A;font-weight:700;">${w.chosen}</span>
            → Correct: <span class="correct-ans">${w.correct}</span></div>
        </div>`).join('');

  document.getElementById('quiz-wrap').innerHTML = `
    <div class="results">
      <div style="font-size:4rem;margin-bottom:0.5rem;">${emoji}</div>
      <h2>${msg}</h2>
      <div class="final-score">${score} / ${maxScore}</div>
      <div class="final-pct">${pct}% correct</div>
      ${wrongAnswers.length > 0 ? `
        <div class="wrong-list">
          <div class="wrong-list-title">Questions to review:</div>
          ${wrongHtml}
        </div>` : wrongHtml}
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;">
        <button class="restart-btn" onclick="restart()">Tentar novamente</button>
        <a href="index.html" class="back-home">← Voltar ao início</a>
      </div>
    </div>`;
}

function restart() {
  current = 0; score = 0; wrongAnswers = [];
  answered = false;
  render();
}

render();
</script>
</body>
</html>
